name: Build and Deploy to Netlify and Vercel
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NETLIFY_AUTH_TOKEN: ${{ vars.NETLIFY_AUTH_TOKEN }}
  NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}

on:
  push:
    branches:
      - master

  pull_request:
  # workflow_dispatch:
  #   inputs:
  #     deploy-netlify:
  #       type: boolean
  #       description: Enable Netlify deployment
  #       default: true
  #     deploy-vercel:
  #       type: boolean
  #       description: Enable Vercel deployment
  #       default: true

jobs:
  test:
    uses: ./.github/workflows/tests.yml
  build:
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      issues: write      # to create issue comments
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 5

      - name: Build app
        run: npm run build
        timeout-minutes: 5

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        timeout-minutes: 1
        # if: ${{ inputs.deploy-netlify }}
        with:
          publish-dir: './dist'
          production-branch: master
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: 'Deploy from GitHub Actions'
          enable-pull-request-comment: false
          enable-commit-comment: true
          overwrites-pull-request-comment: true

      - name: Install Vercel CLI
        # if: ${{ inputs.deploy-vercel }}
        run: npm install --global vercel@canary

      - name: Pull Vercel Environment Information
        # if: ${{ inputs.deploy-vercel }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts for Vercel
        # if: ${{ inputs.deploy-vercel }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: |
          DEPLOY_OUTPUT="$(vercel deploy --token=${{ secrets.VERCEL_TOKEN }})"
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep http | tail -n 1)
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV

      - name: Comment with preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { DEPLOY_URL } = process.env;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `👁️‍🗨️ Preview URL: ${DEPLOY_URL}`
            })